<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registrasi — Website Data</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.jpeg" type="image/jpeg">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="Index.html" class="brand" aria-label="Website Data">
          <div class="logo-thumb" aria-hidden="true">
            <img src="favicon.jpeg" alt="Logo Website Data" class="logo-animate">
          </div>
          <div class="brand-text">
            <h1 class="site-title">Registrasi</h1>
            <p class="tagline">Bergabung untuk akses dashboard</p>
          </div>
        </a>

        <nav aria-label="Navigasi halaman">
          <ul class="nav">
            <li><a href="Index.html">Beranda</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container form-page">
      <h2>Buat akun baru</h2>
      <form id="registerForm" novalidate>
        <div class="form-grid">
          <div>
            <label for="fullname">Nama Lengkap</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Kata Sandi</label>
            <input type="password" id="password" name="password" required minlength="8">

            <label for="confirmPassword">Konfirmasi Kata Sandi</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
          </div>

          <div>
            <label for="whatsapp">Nomor WhatsApp</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="+62 812-3456-7890" required>

            <label for="chapchat">Chapchat (username)</label>
            <input type="text" id="chapchat" name="chapchat" placeholder="username_chat" required>

            <label for="dob">Tanggal Lahir</label>
            <input type="date" id="dob" name="dob" required>

            <div class="age-display">Umur: <span id="calculatedAge">—</span></div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Daftar</button>
        </div>
      </form>

      <div id="formMessage" role="status" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 Website Data</div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
