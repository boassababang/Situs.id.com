<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard — Website Data</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.jpeg" type="image/jpeg">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="Index.html" class="brand" aria-label="Website Data">
          <div class="logo-thumb" aria-hidden="true">
            <img src="favicon.jpeg" alt="Logo Website Data" class="logo-animate">
          </div>
          <div class="brand-text">
            <h1 class="site-title">Dashboard Data</h1>
            <p class="tagline">Ringkasan & Visualisasi</p>
          </div>
        </a>

        <nav aria-label="Navigasi dashboard">
          <ul class="nav">
            <li><a href="Index.html">Beranda</a></li>
            <li><a href="register.html">Registrasi</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2>Data Pengguna (Contoh)</h2>
      <p>Ini adalah kerangka tabel data. Setelah registrasi, pengguna akan muncul di tabel ini.</p>
      <table class="data-table" id="usersTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Nama</th>
            <th>Email</th>
            <th>WhatsApp</th>
            <th>Chapchat</th>
            <th>Umur</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data akan dimuat di sini melalui JavaScript -->
        </tbody>
      </table>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 Website Data</div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
